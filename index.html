<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeOS</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem("lifeos_theme_mode");
          var c = localStorage.getItem("lifeos_color_scheme");
          document.documentElement.setAttribute(
            "data-style",
            s === "glass" || s === "clay" ? s : "clay"
          );
          document.documentElement.setAttribute(
            "data-scheme",
            c === "dark" || c === "light" ? c : "light"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-style", "clay");
          document.documentElement.setAttribute("data-scheme", "light");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
