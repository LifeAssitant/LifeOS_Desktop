<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeOS</title>
    <script>
      (function () {
        var theme = "playful";
        try {
          var stored = localStorage.getItem("lifeos_theme");
          if (stored === "professional" || stored === "playful") theme = stored;
          else {
            var legacy = localStorage.getItem("lifeos_theme_mode");
            if (legacy === "glass" || legacy === "ocean") theme = "professional";
          }
        } catch (e) {
          /* first run */
        }
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme =
          theme === "professional" ? "dark" : "light";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
